<!DOCTYPE html>
<!-- AI RADAR — SIDEBAR (bridge) — v2
     The sidebar can no longer use the mic directly: Chrome blocks microphone
     access inside Apps Script sidebars (sandboxed cross-origin iframe).
     Instead, this sidebar:
       1. opens the voice POPUP (a top-level window, where the mic works),
       2. relays the popup's questions to the server (google.script.run),
       3. relays the answers back, and
       4. still offers typed questions, which work right here.
     Keep this sidebar open while using the popup. -->
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Google Sans', Arial, sans-serif; margin: 0; padding: 14px; color: #202124; font-size: 14px; }
    #status { color: #5f6368; font-size: 12px; min-height: 18px; margin-bottom: 10px; }
    .bigbtn { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none;
              border-radius: 8px; margin: 6px 0 4px; cursor: pointer; font-size: 14px; }
    .bigbtn:hover { background: #1765cc; }
    .why { font-size: 11px; color: #80868b; text-align: center; margin: 2px 0 14px; }
    #answer { background: #e8f0fe; border-radius: 8px; padding: 8px 10px; margin: 10px 0; display: none; }
    input[type=text] { width: 100%; padding: 6px 8px; margin: 4px 0 6px; box-sizing: border-box;
                       border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; }
    label { font-size: 12px; color: #5f6368; }
    #askTyped { width: 100%; padding: 8px; background: #188038; color: #fff; border: none;
                border-radius: 4px; cursor: pointer; font-size: 13px; }
    hr { border: none; border-top: 1px solid #eee; margin: 14px 0; }
  </style>
</head>
<body>
  <div id="status">Ready. Tap below to talk — voice runs in a small popup window.</div>
  <button id="openVoice" class="bigbtn">🎙 Start voice conversation</button>
  <div class="why">Chrome blocks the mic inside sidebars, so listening happens in a popup.
    Keep this sidebar open while the popup is in use.</div>

  <div id="answer"></div>

  <hr>
  <label>Or type your question (works right here)</label>
  <input type="text" id="typed" placeholder="e.g. any urgent fixes today?">
  <button id="askTyped">Ask</button>

<script>
  var voiceWin = null;

  function setStatus(s) { document.getElementById('status').textContent = s; }

  // ---- typed questions: straight to the server ----
  function askServer(question) {
    if (!question) return;
    setStatus('Thinking\u2026');
    google.script.run
      .withSuccessHandler(function (answer) {
        var a = document.getElementById('answer');
        a.style.display = 'block';
        a.textContent = answer;
        setStatus('Answer shown below.');
        try { speechSynthesis.speak(new SpeechSynthesisUtterance(answer)); } catch (e) {}
      })
      .withFailureHandler(function (err) { setStatus('Error: ' + err.message); })
      .ask(question);
  }

  document.getElementById('askTyped').onclick = function () {
    var q = document.getElementById('typed').value.trim();
    if (q) askServer(q);
    document.getElementById('typed').value = '';
  };
  document.getElementById('typed').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('askTyped').click();
  });

  // ---- popup bridge ----
  function openVoicePopup() {
    setStatus('Opening voice window\u2026');
    google.script.run
      .withSuccessHandler(function (html) {
        voiceWin = window.open('', '_blank');
        if (!voiceWin) {
          setStatus('Popup blocked \u2014 allow popups for this page (icon in the address bar), then tap again.');
          return;
        }
        voiceWin.document.open();
        voiceWin.document.write(html);
        voiceWin.document.close();
        setStatus('Voice window open \u2014 speak there. Keep this sidebar open.');
      })
      .withFailureHandler(function (err) { setStatus('Error: ' + err.message); })
      .getPopupHtml();
  }
  document.getElementById('openVoice').onclick = openVoicePopup;

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.type) return;
    if (d.type === 'ask' && d.question) {
      setStatus('Thinking\u2026');
      google.script.run
        .withSuccessHandler(function (answer) {
          postToVoice({ type: 'answer', text: answer });
          setStatus('Answered \u2014 see the voice window.');
        })
        .withFailureHandler(function (err) {
          postToVoice({ type: 'error', text: err.message });
          setStatus('Error: ' + err.message);
        })
        .ask(d.question);
    }
    if (d.type === 'popupClosed') voiceWin = null;
  });

  function postToVoice(msg) {
    try { if (voiceWin && !voiceWin.closed) voiceWin.postMessage(msg, '*'); } catch (e) {}
  }
</script>
</body>
</html>
